<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iframe test</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #e8f5e9; }
    .wrap { padding: 12px; max-width: 390px; margin: 0 auto; }
    iframe {
      width: 100%;
      height: 420px;
      border: 2px solid #43a047;
      border-radius: 12px;
      background: #fff;
    }
    p { font-size: 13px; color: #333; }
  </style>
</head>
<body>
  <div class="wrap">
    <p>Фиксированная высота iframe 420px (как в LMS)</p>
    <iframe src="index.html?mode=slides" title="Комикс"></iframe>
  </div>
</body>
</html>
